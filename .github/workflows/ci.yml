name: CI Test Suite

on:
  push:
    branches:
      - main
      - 'phase-*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Test Dependencies
        # Only pytest + pytest-mock needed:
        # tests/conftest.py mocks all heavy packages (langchain, langgraph,
        # qdrant-client, sentence-transformers, streamlit, requests, PIL, etc.)
        # so none of those need to be installed in CI.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v
